[package]
build = "build.rs"
name = "yj-sandbox"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "Windows restricted-token and macOS Seatbelt sandbox (vendored & decoupled from openai/codex)"
repository = "https://github.com/yoke233/yj-sandbox"

[lib]
name = "yj_sandbox"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "yj-sandbox-run"
path = "src/bin/yj-sandbox-run/main.rs"

[[bin]]
name = "codex-windows-sandbox-setup"
path = "src/bin/setup_main/main.rs"

[[bin]]
name = "codex-command-runner"
path = "src/bin/command_runner/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing-appender = "0.2"
tracing = "0.1"
dirs-next = "2.0"
regex-lite = "0.1"
url = "2.5"

[dependencies.rand]
version = "0.8"
default-features = false
features = ["std", "small_rng"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_Rpc",
    "Win32_System_Registry",
]

[target.'cfg(windows)'.dependencies.base64]
version = "0.22"

[target.'cfg(windows)'.dependencies.glob]
version = "0.3"

[target.'cfg(windows)'.dependencies.tempfile]
version = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
]

[dev-dependencies]
glob = "0.3"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
