name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: yj-sandbox-run

jobs:
  build-windows:
    name: Build Windows x86_64/aarch64
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { exit 0 }
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tagVersion -ne $packageVersion) {
            throw "release tag $env:GITHUB_REF_NAME does not match Cargo version $packageVersion"
          }

      - name: Build
        run: cargo build --release --bins

      - name: Build ARM64
        run: |
          $target = "aarch64-pc-windows-msvc"
          $sysroot = (rustc --print sysroot).Trim()
          $targetLib = Join-Path $sysroot "lib\rustlib\$target\lib"
          if (-not (Test-Path -LiteralPath $targetLib)) {
            throw "Rust target $target is not installed in $sysroot"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products * -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio installation not found"
          }
          $vcVersion = (Get-Content (Join-Path $vsInstall "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt")).Trim()
          $vcTools = Join-Path $vsInstall "VC\Tools\MSVC\$vcVersion"
          $linker = Join-Path $vcTools "bin\Hostx64\arm64\link.exe"
          if (-not (Test-Path -LiteralPath $linker)) {
            throw "ARM64 linker not found: $linker"
          }

          $kitsRoot = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots").KitsRoot10
          $sdkVersion = Get-ChildItem (Join-Path $kitsRoot "Lib") -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "ucrt\arm64") } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw "Windows SDK ARM64 libraries not found under $kitsRoot"
          }

          $env:CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER = $linker
          $env:LIB = @(
            (Join-Path $vcTools "lib\arm64")
            (Join-Path $kitsRoot "Lib\$sdkVersion\um\arm64")
            (Join-Path $kitsRoot "Lib\$sdkVersion\ucrt\arm64")
          ) -join ";"
          cargo build --release --bins --target $target

      - name: Gemini Windows E2E
        timeout-minutes: 5
        run: .\tools\test-gemini-e2e.ps1 -SandboxExe .\target\release\yj-sandbox-run.exe

      - name: Package
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "${{ github.ref_name }}") {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          $dist = Join-Path $PWD "dist"

          function Package-One([string]$arch, [string]$targetDir) {
            $packageName = "yj-sandbox-v$version-windows-$arch"
            $packageDir = Join-Path $dist $packageName
            $binDir = Join-Path $packageDir "bin"
            $resourcesDir = Join-Path $packageDir "codex-resources"
            New-Item -ItemType Directory -Path $binDir,$resourcesDir -Force | Out-Null
            Copy-Item (Join-Path $targetDir "$env:BIN_NAME.exe") $binDir
            Copy-Item (Join-Path $targetDir "codex-command-runner.exe") $resourcesDir
            Copy-Item (Join-Path $targetDir "codex-windows-sandbox-setup.exe") $resourcesDir
            Copy-Item README.md,LICENSE,NOTICE $packageDir
            Compress-Archive -LiteralPath $packageDir -DestinationPath "$dist/$packageName.zip" -Force
          }

          Package-One "x86_64" "target/release"
          Package-One "aarch64" "target/aarch64-pc-windows-msvc/release"

      - uses: actions/upload-artifact@v4
        with:
          name: yj-sandbox-windows
          path: dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS x86_64/aarch64
    runs-on: [self-hosted, macOS, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Select Rust toolchain
        run: |
          set -euo pipefail
          rustup_bin="$HOME/.rustup/toolchains/stable-x86_64-apple-darwin/bin"
          if [ -x "$rustup_bin/cargo" ]; then
            echo "CARGO=$rustup_bin/cargo" >> "$GITHUB_ENV"
            echo "RUSTC=$rustup_bin/rustc" >> "$GITHUB_ENV"
            echo "$rustup_bin" >> "$GITHUB_PATH"
          else
            echo "CARGO=cargo" >> "$GITHUB_ENV"
            echo "RUSTC=rustc" >> "$GITHUB_ENV"
          fi
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify release version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then exit 0; fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag_version" != "$package_version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match Cargo version $package_version" >&2
            exit 1
          fi

      - name: Test
        run: |
          "$CARGO" test --all-targets --target x86_64-apple-darwin

      - name: Build
        run: |
          set -euo pipefail
          if [ -x /usr/local/bin/rustup ]; then
            /usr/local/bin/rustup target add x86_64-apple-darwin aarch64-apple-darwin
          elif command -v rustup >/dev/null 2>&1; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          fi
          "$CARGO" build --release --bin "$BIN_NAME" --target x86_64-apple-darwin
          "$CARGO" build --release --bin "$BIN_NAME" --target aarch64-apple-darwin
          lipo -create \
            -output target/yj-sandbox-run-universal \
            target/x86_64-apple-darwin/release/$BIN_NAME \
            target/aarch64-apple-darwin/release/$BIN_NAME

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          dist="$PWD/dist"
          mkdir -p "$dist"

          package_one() {
            arch="$1"
            bin_path="$2"
            package_name="yj-sandbox-v${version}-macos-${arch}"
            package_dir="$dist/$package_name"
            mkdir -p "$package_dir"
            cp "$bin_path" "$package_dir/$BIN_NAME"
            cp README.md LICENSE NOTICE "$package_dir/"
            (cd "$dist" && tar -czf "$package_name.tar.gz" "$package_name")
          }

          package_one x86_64 "target/x86_64-apple-darwin/release/$BIN_NAME"
          package_one aarch64 "target/aarch64-apple-darwin/release/$BIN_NAME"
          package_one universal "target/yj-sandbox-run-universal"

      - uses: actions/upload-artifact@v4
        with:
          name: yj-sandbox-macos
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: [self-hosted, macOS, X64]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec shasum -a 256 {} + | sed 's#  ./#  #' > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: yj-sandbox ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
