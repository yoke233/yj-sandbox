name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} platform tests
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test crate
        run: cargo test --all-targets

  windows:
    name: Windows tests and sync-tool contract
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test crate
        run: cargo test --all-targets

      - name: Test Codex sync tooling
        run: .\tools\test-sync-codex.ps1
